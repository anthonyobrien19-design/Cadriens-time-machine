name: Build Time Machine app

# Builds the Android app every time something is pushed to main
# (or when you press "Run workflow" on the Actions tab),
# then publishes TimeMachine.apk on the repo's Releases page.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # to save the signing key the first time, and to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create the signing key (first build only)
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/release.jks -alias timemachine \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass timemachine -keypass timemachine \
              -dname "CN=Time Machine, O=Family"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/release.jks
            git commit -m "Save the app signing key [skip ci]"
            git push
          fi

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish TimeMachine.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk TimeMachine.apk
          gh release create "v1.${{ github.run_number }}" TimeMachine.apk \
            --title "Time Machine 1.${{ github.run_number }}" \
            --notes "Download TimeMachine.apk and install it on the tablet. Installing over an older version keeps all memories."

      - uses: actions/upload-artifact@v4
        with:
          name: TimeMachine-apk
          path: TimeMachine.apk
